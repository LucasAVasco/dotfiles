# Port
Port 2222
ListenAddress $LISTEN_ADDRESS

# Logging
PidFile $HOME/.ssh/sshd/run/sshd.pid
LogLevel VERBOSE

# Keys
HostKey $HOME/.ssh/sshd/host_ed25519_key
HostKey $HOME/.ssh/sshd/host_rsa_key
AuthorizedKeysFile $HOME/.ssh/sshd/authorized_keys

# Authentication
PasswordAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
UsePAM no
ChallengeResponseAuthentication no

# Permissions
AllowTcpForwarding yes
X11Forwarding no
PermitTTY yes

# SFTP
Subsystem sftp internal-sftp
